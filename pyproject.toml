[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts", "api"]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["clean_data", "config", "upload_to_db", "validate_data", "automate_pipeline", "app", "generate_raw_data"]
